order: 1
category: flagship

en:
  title: "Exit Forward Model"
  context: >-
    Philanthropic programs often lose momentum once funding ends. The design
    is rarely the problem; the missing transition pathway is.
  role: >-
    Originator and delivery owner of the Exit Forward Model, a transition
    framework built into program design from day one.
  scope: >-
    Phased exit planning, local institutional and governance strengthening,
    post-program UMKM capacity development, and time-bound mentoring.
  exit: >-
    Aggregator handover through PasarBaik, so beneficiaries enter stable
    demand and supply channels instead of reverting to dependency.
  signal: >-
    Exit reframed as an extension of impact rather than its conclusion, and
    replicated across several philanthropic engagements.

id:
  title: "Exit Forward Model"
  context: >-
    Program filantropi sering kehilangan momentum begitu pendanaan berakhir.
    Masalahnya jarang ada di desain, melainkan pada jalur transisi yang tidak
    pernah disiapkan.
  role: >-
    Penggagas sekaligus pemilik pelaksanaan Exit Forward Model, kerangka
    transisi yang ditanam ke dalam desain program sejak hari pertama.
  scope: >-
    Perencanaan exit bertahap, penguatan kelembagaan dan tata kelola lokal,
    pengembangan kapasitas UMKM pascaprogram, serta pendampingan berjangka
    waktu.
  exit: >-
    Serah terima ke agregator melalui PasarBaik, sehingga penerima manfaat
    masuk ke kanal permintaan dan pasokan yang stabil, bukan kembali
    bergantung.
  signal: >-
    Exit dimaknai ulang sebagai perpanjangan dampak, bukan akhirnya, dan sudah
    direplikasi di beberapa penugasan filantropi.
