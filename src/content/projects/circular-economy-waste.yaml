order: 3
category: flagship

en:
  title: "Circular Economy and Waste Management Initiative"
  partner: "BRI Life, AKSATA and MB Group"
  context: >-
    Environmental programs are usually treated as time-limited interventions
    rather than as systems that need to pay for themselves.
  role: >-
    Three roles at once: program implementer, waste management operator, and
    off-taker of processed material, which keeps partner risk low.
  scope: >-
    Community drop points, waste bank and cooperative strengthening, plastics-
    to-granules processing, and industrial off-take channels.
  exit: >-
    Independent management transferred to local cooperatives and waste banks,
    with off-take demand from industry partners still in place.
  signal: >-
    A demonstration model showing environmental programs can be operational,
    economically viable and responsibly exited.

id:
  title: "Inisiatif Ekonomi Sirkular dan Pengelolaan Sampah"
  partner: "BRI Life, AKSATA dan MB Group"
  context: >-
    Program lingkungan biasanya diperlakukan sebagai intervensi berjangka,
    bukan sebagai sistem yang harus mampu membiayai dirinya sendiri.
  role: >-
    Tiga peran sekaligus: pelaksana program, operator pengelolaan sampah, dan
    pembeli material olahan, sehingga risiko mitra tetap rendah.
  scope: >-
    Titik kumpul komunitas, penguatan bank sampah dan koperasi, pengolahan
    plastik menjadi biji plastik, serta kanal serapan industri.
  exit: >-
    Pengelolaan mandiri dialihkan ke koperasi dan bank sampah setempat, dengan
    permintaan serapan dari mitra industri tetap berjalan.
  signal: >-
    Model demonstrasi yang menunjukkan program lingkungan bisa operasional,
    layak secara ekonomi, dan diakhiri dengan bertanggung jawab.
