category: engagement

en:
  title: "National MEAL Standards"
  partner: "BAZNAS"
  context: >-
    A replicable monitoring, evaluation, accountability and learning standard
    was needed across national philanthropic programs.
  role: >-
    Co-design partner on the MEAL framework and the capacity building that
    came with it.
  scope: >-
    Framework design, training of program teams, and documentation written so
    other teams can replicate it.
  exit: >-
    Standards transferred to BAZNAS for ongoing internal application.
  signal: >-
    MEAL standards replicated across BAZNAS programs nationally.

id:
  title: "Standar MEAL Nasional"
  partner: "BAZNAS"
  context: >-
    Dibutuhkan standar monitoring, evaluasi, akuntabilitas, dan pembelajaran
    yang bisa direplikasi lintas program filantropi nasional.
  role: >-
    Mitra ko-desain kerangka MEAL beserta penguatan kapasitas yang
    menyertainya.
  scope: >-
    Perancangan kerangka, pelatihan tim program, dan dokumentasi yang ditulis
    agar tim lain bisa mereplikasinya.
  exit: >-
    Standar dialihkan ke BAZNAS untuk diterapkan secara internal dan
    berkelanjutan.
  signal: >-
    Standar MEAL direplikasi ke program-program BAZNAS di tingkat nasional.
