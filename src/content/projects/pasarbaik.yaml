order: 2
category: flagship

en:
  title: "PasarBaik, Impact Supply Aggregator"
  partner: "Kementerian Perdagangan RI and multiple philanthropic partners"
  context: >-
    Post-program UMKM beneficiaries lacked consistent market access, which
    undermined the long-term value of the philanthropic investment.
  role: >-
    Operating partner for PasarBaik.com, the aggregation mechanism matching
    philanthropic UMKM supply to domestic and export demand.
  scope: >-
    Supply aggregation, quality and compliance readiness, market facilitation,
    and off-take coordination across several commodities.
  exit: >-
    Built as a market-based mechanism from the start, so sustainability is the
    operating model rather than an afterthought.
  signal: >-
    Philanthropic UMKMs aggregated into domestic and export pathways under the
    Aid for Trade framework.

id:
  title: "PasarBaik, Agregator Pasokan Dampak"
  partner: "Kementerian Perdagangan RI dan sejumlah mitra filantropi"
  context: >-
    UMKM penerima manfaat pascaprogram tidak punya akses pasar yang konsisten,
    sehingga nilai jangka panjang investasi filantropi ikut tergerus.
  role: >-
    Mitra operasi PasarBaik.com, mekanisme agregasi yang mempertemukan pasokan
    UMKM binaan filantropi dengan permintaan domestik dan ekspor.
  scope: >-
    Agregasi pasokan, kesiapan mutu dan kepatuhan, fasilitasi pasar, serta
    koordinasi serapan lintas beberapa komoditas.
  exit: >-
    Dibangun sebagai mekanisme berbasis pasar sejak awal, sehingga
    keberlanjutan adalah model operasinya, bukan tambahan di akhir.
  signal: >-
    UMKM binaan filantropi teragregasi ke jalur pasar domestik dan ekspor
    dalam kerangka Aid for Trade.
