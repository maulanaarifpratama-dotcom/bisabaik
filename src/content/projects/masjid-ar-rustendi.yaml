en:
  title: "Masjid Jami Ar-Rustendi: a community mosque built with open books"
  partner: "DKM Ar-Rustendi, with Bank DKI (UPZ Bank DKI) and BAZNAS"
  context: >-
    In Kp. Rumpin Tegal Indah, Bogor, the nearest mosque is too far for elders
    and children, and Friday, Tarawih and Eid prayers spill onto the road. The
    land is waqf from the heirs of the Ar-Rustendi family, and the mosque
    states that it is registered in the Ministry of Religious Affairs' SIMAS
    registry.
  role: >-
    Facilitator, not owner. We help the mosque management committee (DKM) run
    construction as an accountable project: a published budget, a public
    donor ledger, and dated field documentation. Two members of our team sit
    on the DKM, and one of the mosque's published donation accounts is held in
    the name of our foundation. Decisions are the committee's.
  scope: >-
    Four build phases on 168 square metres against a published budget (RAB)
    of Rp625,050,247, drawn up by an architectural firm and validated by the
    DKM: foundation and structure, walls and roof, finishing, supporting
    facilities. First stone on 14 June 2026, roof cast with residents on 20
    September 2026, second phase from October 2026.
  exit: >-
    Governance sits with the DKM from the start. It keeps its own accounts,
    website and Instagram, takes its own donations, and answers to its own
    congregation, so the building does not depend on us to keep standing.
  signal: >-
    On 12 November 2026 the public ledger recorded Rp372,337,000, or 59.6% of
    the budget: Rp300,000,000 of initial construction capital and Rp72,337,000
    of waqf, from 82 listed donors including Bank DKI (Rp7,500,000, through its
    zakat unit UPZ Bank DKI) and BAZNAS (Rp10,000,000). Figures are the
    mosque's own and keep moving, so check the ledger.

id:
  title: "Masjid Jami Ar-Rustendi: masjid warga yang dibangun dengan pembukuan terbuka"
  partner: "DKM Ar-Rustendi, bersama Bank DKI (UPZ Bank DKI) dan BAZNAS"
  context: >-
    Di Kp. Rumpin Tegal Indah, Bogor, masjid terdekat terlalu jauh bagi lansia
    dan anak-anak, dan jamaah salat Jumat, Tarawih, dan Id meluber sampai ke
    jalan. Tanahnya wakaf dari ahli waris keluarga Ar-Rustendi, dan masjid
    menyatakan terdaftar di SIMAS Kementerian Agama.
  role: >-
    Fasilitator, bukan pemilik. Kami membantu Dewan Kemakmuran Masjid (DKM)
    menjalankan pembangunan sebagai proyek yang akuntabel: anggaran
    terpublikasi, daftar donatur terbuka, dan dokumentasi lapangan bertanggal.
    Dua anggota tim kami duduk di DKM, dan salah satu rekening donasi yang
    dipublikasikan masjid atas nama yayasan kami. Keputusan ada di tangan
    pengurus.
  scope: >-
    Empat tahap pembangunan di atas lahan 168 meter persegi dengan anggaran
    (RAB) terpublikasi Rp625.050.247, disusun biro arsitektur dan divalidasi
    DKM: pondasi dan struktur, dinding dan atap, finishing, serta fasilitas
    penunjang. Batu pertama 14 Juni 2026, atap dicor bersama warga 20
    September 2026, tahap kedua dimulai Oktober 2026.
  exit: >-
    Tata kelola ada di DKM sejak awal. DKM memegang pembukuan, situs, dan
    Instagram sendiri, menerima donasi sendiri, dan bertanggung jawab kepada
    jamaahnya, sehingga bangunan ini tidak bergantung pada kami untuk tetap
    berdiri.
  signal: >-
    Pada 12 November 2026 buku kas terbuka mencatat Rp372.337.000, atau 59,6%
    dari anggaran: modal awal pembangunan Rp300.000.000 dan wakaf
    Rp72.337.000 dari 82 donatur tercatat, termasuk Bank DKI (Rp7.500.000,
    lewat unit zakatnya UPZ Bank DKI) dan BAZNAS (Rp10.000.000). Angka itu
    milik masjid dan terus bergerak, jadi periksa buku kasnya.
