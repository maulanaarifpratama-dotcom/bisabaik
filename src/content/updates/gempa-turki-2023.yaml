date: "2023-03"
location: "Earthquake-affected area, Türkiye"
pillar: humanity
programType: humanitarian-relief
beneficiaries: "Families in the earthquake zone"
source: "Bisa Baik Bersama programme documentation, March 2023 (also an Instagram highlight)"
photo: "gempa-turki-2023.jpg"
en:
  title: "Türkiye earthquake: 50 food packages and 500 hot meals"
  photoAlt: "A volunteer in a beige vest carrying a box of food aid past tents in an earthquake-affected neighbourhood."
  body: >-
    In March 2023 we delivered aid to families affected by the earthquake in
    Türkiye: 50 food packages (sembako) and 500 hot meals served from a
    community kitchen, distributed from a vehicle carrying the programme banner.
id:
  title: "Gempa Türkiye: 50 paket sembako dan 500 porsi makanan hangat"
  photoAlt: "Seorang relawan berompi krem memanggul kardus bantuan pangan melewati tenda di lingkungan yang terdampak gempa."
  body: >-
    Pada Maret 2023 kami menyalurkan bantuan kepada keluarga terdampak gempa di
    Türkiye: 50 paket sembako dan 500 porsi makanan hangat dari dapur umum,
    dibagikan dari kendaraan yang membawa spanduk program.
