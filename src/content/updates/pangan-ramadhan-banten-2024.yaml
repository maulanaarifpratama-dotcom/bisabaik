en:
  title: "Ramadan food packages delivered door to door in Banten"
  photoAlt: "A volunteer in a black vest sitting beside an elderly woman who holds a green bag of food aid, in front of a wooden house."
  body: >-
    During Ramadan 2024, volunteers delivered food packages to households in
    Banten, visiting recipients at their homes and recording each hand-over
    with a signed card. Household counts for this round are not published yet.
id:
  title: "Paket pangan Ramadan diantar ke rumah warga di Banten"
  photoAlt: "Seorang relawan berompi hitam duduk di samping perempuan lansia yang memegang tas hijau berisi bantuan pangan, di depan rumah kayu."
  body: >-
    Selama Ramadan 2024, relawan mengantar paket pangan ke rumah warga di
    Banten dan mencatat tiap penyerahan dengan kartu bertanda tangan. Jumlah
    rumah tangga untuk putaran ini belum kami publikasikan.
