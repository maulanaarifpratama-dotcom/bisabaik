date: "2025-06-13"
location: "Pagerageung, Tasikmalaya, West Java"
pillar: humanity
programType: food-security
beneficiaries: "50 households"
source: "Instagram @bisabaik.or.id, 13 June 2025"
sourceUrl: "https://www.instagram.com/bisabaik.or.id/p/DK1gZesB6k6/"
en:
  title: "Beyond Qurban 2025: three sacrificial animals, 50 households reached"
  body: >-
    Qurban distribution ran in two villages of Pagerageung sub-district,
    Tasikmalaya — Desa Cikoranji and Desa Nanggewer — with three sheep shared
    across 50 recipient households. The programme paired the religious
    observance with a food-security objective for the receiving villages.
id:
  title: "Beyond Qurban 2025: tiga ekor domba, menjangkau 50 kepala keluarga"
  body: >-
    Penyaluran qurban berlangsung di dua desa Kecamatan Pagerageung,
    Tasikmalaya — Desa Cikoranji dan Desa Nanggewer — dengan tiga ekor domba
    yang dibagikan ke 50 kepala keluarga penerima. Program ini menggabungkan
    ibadah qurban dengan tujuan ketahanan pangan bagi desa penerima.
