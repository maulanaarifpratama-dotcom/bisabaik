en:
  title: "Masjid Jami Ar-Rustendi: building a mosque with transparent books"
  body: >-
    We facilitate the construction of Masjid Jami Ar-Rustendi in Rumpin, a
    community mosque listed in the Ministry of Religious Affairs' SIMAS
    registry, with a published budget (RAB) of Rp625,050,247 and four build
    phases for 2026. As of 12 November 2026 the public ledger records
    Rp372,337,000, or 59.6% of the budget, from 82 named donors plus UPZ Bank
    DKI, Bank DKI and BAZNAS. Foundation and structure work is under way, and
    wall work has started. Two members of our team sit on the mosque's
    management committee (DKM), and the mosque publishes its own accounts.
id:
  title: "Masjid Jami Ar-Rustendi: membangun masjid dengan pembukuan terbuka"
  body: >-
    Kami memfasilitasi pembangunan Masjid Jami Ar-Rustendi di Rumpin, masjid
    komunitas yang terdaftar di SIMAS Kementerian Agama, dengan RAB terpublikasi
    Rp625.050.247 dan empat tahap pembangunan pada 2026. Per 12 November 2026
    catatan terbuka mereka mencatat Rp372.337.000, atau 59,6% dari anggaran,
    dari 82 donatur bernama serta UPZ Bank DKI, Bank DKI, dan BAZNAS. Pekerjaan
    pondasi dan struktur berjalan, dan pekerjaan dinding sudah dimulai. Dua
    anggota tim kami duduk di kepengurusan DKM masjid, dan masjid menerbitkan
    laporan keuangannya sendiri.
