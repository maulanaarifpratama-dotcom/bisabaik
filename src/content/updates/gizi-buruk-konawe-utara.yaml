en:
  title: "Nutrition aid to families in Konawe Utara"
  body: >-
    Our team visited families in Konawe Utara whose children were affected by
    severe malnutrition (gizi buruk), delivering bags of food aid to each
    household. We publish no photographs of this programme, to protect the
    children's health information. Dates and household counts are not
    published yet.
id:
  title: "Bantuan gizi untuk keluarga di Konawe Utara"
  body: >-
    Tim kami mengunjungi keluarga di Konawe Utara yang anaknya terdampak gizi
    buruk, dan mengantarkan tas bantuan pangan ke tiap rumah. Kami tidak
    menerbitkan foto program ini demi melindungi informasi kesehatan anak.
    Tanggal dan jumlah keluarga belum kami publikasikan.
