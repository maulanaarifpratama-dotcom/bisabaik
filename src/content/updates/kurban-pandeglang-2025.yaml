date: "2025-06"
location: "Pandeglang, Banten"
pillar: humanity
programType: food-security
beneficiaries: "Village households"
source: "Bisa Baik Bersama programme documentation, June 2025 (also an Instagram highlight)"
photo: "kurban-pandeglang-2025.jpg"
detail: ongoing
en:
  title: "Kurban 2025 in Pandeglang: meat delivered to village households"
  photoAlt: "A volunteer in a black vest handing a small plastic bag to an elderly woman at the doorway of her home."
  body: >-
    In June 2025 our kurban programme reached villages in Pandeglang: animals
    were slaughtered in the community and the meat was carried by volunteers to
    households, some by motorbike along village paths. Household counts are not
    published yet.
id:
  title: "Kurban 2025 di Pandeglang: daging diantar ke rumah warga desa"
  photoAlt: "Seorang relawan berompi hitam menyerahkan kantong plastik kecil kepada perempuan lansia di ambang pintu rumahnya."
  body: >-
    Pada Juni 2025 program kurban kami menjangkau desa-desa di Pandeglang:
    hewan disembelih di tengah warga, lalu dagingnya diantar relawan ke rumah,
    sebagian dengan sepeda motor menyusuri jalan desa. Jumlah rumah tangga
    belum kami publikasikan.
