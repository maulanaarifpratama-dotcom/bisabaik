en:
  title: "Berbagi Lebaran Yatim: a prayer gathering and gifts for orphans in Rumpin"
  photoAlt: "Volunteers and children seated on a red carpet under a covered terrace, with a banner reading Berbagi Lebaran Yatim on the wall behind."
  body: >-
    On 10 Muharram 1447 H, in early July 2025, our volunteers held a Berbagi
    Lebaran Yatim gathering in Rumpin, Bogor: children from the neighbourhood
    came together for prayers, and each was handed an envelope, with a group
    photograph at the end. The number of children is not published yet.
id:
  title: "Berbagi Lebaran Yatim: doa bersama dan santunan anak yatim di Rumpin"
  photoAlt: "Relawan dan anak-anak duduk di atas karpet merah di teras beratap, dengan spanduk Berbagi Lebaran Yatim di dinding belakang."
  body: >-
    Pada 10 Muharram 1447 H, awal Juli 2025, relawan kami menggelar Berbagi
    Lebaran Yatim di Rumpin, Bogor: anak-anak sekitar berkumpul untuk doa
    bersama, masing-masing menerima amplop, lalu berfoto bersama. Jumlah anak
    belum kami publikasikan.
