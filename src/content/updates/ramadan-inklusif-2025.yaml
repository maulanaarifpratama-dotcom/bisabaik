date: "2025-03-30"
location: "Pandeglang (Banten) and Bogor (West Java)"
pillar: humanity
programType: humanitarian-relief
beneficiaries: "Elderly and informal-sector residents"
source: "Instagram @bisabaik.or.id, 30 March 2025"
en:
  title: "Ramadan Inklusif: essential-goods packages for elderly residents"
  body: >-
    Under the Ramadan Inklusif initiative, basic-needs packages were delivered
    to elderly and informal-sector residents during Ramadan 1446H, including
    recipients in Pandeglang and Bogor. The programme documented individual
    recipients' circumstances — among them an elderly street vendor still
    trading in her eighties — to show who assistance reaches, not only how many.
id:
  title: "Ramadan Inklusif: paket kebutuhan pokok untuk warga lanjut usia"
  body: >-
    Melalui inisiatif Ramadan Inklusif, paket kebutuhan pokok disalurkan
    kepada warga lanjut usia dan pelaku usaha informal selama Ramadan 1446H,
    termasuk penerima di Pandeglang dan Bogor. Program ini mendokumentasikan
    kondisi penerima secara personal — termasuk seorang pedagang lansia yang
    masih berjualan di usia 80 tahun — untuk menunjukkan siapa yang terbantu,
    bukan sekadar berapa banyak.
