en:
  title: "Water and sanitation assessment of shared water points in Pandeglang"
  photoAlt: "A covered communal wash basin with a corrugated metal roof, a brick wall and scattered litter on the ground."
  body: >-
    On 13 June 2025 our team documented the condition of shared water points
    in a Pandeglang village, among them a covered communal wash basin and an
    open pool of standing water. This was an assessment visit; findings and
    any follow-up programme are not published here yet.
id:
  title: "Asesmen air dan sanitasi pada titik air bersama di Pandeglang"
  photoAlt: "Bak cuci komunal beratap seng bergelombang dengan dinding bata dan sampah berserakan di tanah."
  body: >-
    Pada 13 Juni 2025 tim kami mendokumentasikan kondisi titik air bersama di
    sebuah desa di Pandeglang, di antaranya bak cuci komunal beratap dan kolam
    air tergenang yang terbuka. Ini kunjungan asesmen; temuan dan program
    lanjutannya belum kami publikasikan.
