date: "2026-01-20"
location: "Flood-affected districts, Sumatra"
pillar: humanity
programType: humanitarian-relief
beneficiaries: "Mothers and children displaced by flooding"
partner: "SMAN 34 Jakarta (community fundraising partner)"
source: "Instagram @bisabaik.or.id, 19–20 January 2026 (#BersamaPelukSumatra)"
sourceUrl: "https://www.instagram.com/bisabaik.or.id/p/DTu1HQJiI5c/"
en:
  title: "#BersamaPelukSumatra: Rp36.8 million disbursed for flood-displaced mothers and children"
  body: >-
    Following flooding in Sumatra, funds raised through the #BersamaPelukSumatra
    appeal — Rp36,800,000 in total, with SMAN 34 Jakarta as a named community
    fundraising partner — were disbursed through a field post, Posko Darurat
    Ruang Aman Ibu & Anak, providing hygiene kits and trauma-healing support
    for displaced mothers and children.
id:
  title: "#BersamaPelukSumatra: Rp36,8 juta disalurkan untuk ibu dan anak korban banjir"
  body: >-
    Menyusul banjir di Sumatra, dana yang terkumpul lewat penggalangan
    #BersamaPelukSumatra — total Rp36.800.000, dengan SMAN 34 Jakarta sebagai
    mitra penggalangan dana komunitas — disalurkan melalui posko lapangan,
    Posko Darurat Ruang Aman Ibu & Anak, berupa hygiene kit dan dukungan
    trauma healing bagi ibu dan anak yang mengungsi.
