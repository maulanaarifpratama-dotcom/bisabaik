en:
  title: "Jumat Berkah: Friday meal packs shared at a neighbourhood mosque"
  photoAlt: "Two men in white shirts shaking hands outside a mosque, one holding a pink bag of meals."
  body: >-
    On Friday 8 August 2025, volunteers handed out meal packs to residents
    gathered at a neighbourhood mosque, part of our Jumat Berkah programme. The
    number of packs and the schedule of other rounds are not published yet.
id:
  title: "Jumat Berkah: nasi bungkus Jumat dibagikan di masjid lingkungan"
  photoAlt: "Dua pria berbaju putih berjabat tangan di depan masjid, salah satunya memegang kantong plastik merah muda berisi makanan."
  body: >-
    Pada Jumat 8 Agustus 2025, relawan membagikan paket makanan kepada warga
    yang berkumpul di sebuah masjid lingkungan, bagian dari program Jumat
    Berkah. Jumlah paket dan jadwal putaran lainnya belum kami publikasikan.
