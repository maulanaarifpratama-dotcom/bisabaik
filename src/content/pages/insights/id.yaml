practice:
  heading: Wawasan lahir di lapangan, bukan di dek presentasi.
  body: >-
    Setiap kerangka yang kami terbitkan sudah melewati sesi ko-desain, tinjauan
    risiko, dan gesekan sehari-hari pelaksanaan yang akuntabel.
  imageAlt: >-
    Dua perempuan lansia di desa tertawa bersama, salah satunya dengan handuk
    di kepala.

forthcoming: Segera terbit

