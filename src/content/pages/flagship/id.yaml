meta:
  title: "Program unggulan: Exit Forward, PasarBaik, ekonomi sirkular"
  description: >-
    Exit Forward Model, agregator pasokan dampak PasarBaik, dan inisiatif
    ekonomi sirkular serta pengelolaan sampah. Tiga model praktis yang
    membuktikan exit bisa memperpanjang dampak.

header:
  title: Ruang praktik tempat exit berubah jadi perpanjangan.
  intro: >-
    Program unggulan kami bukan uji coba. Ini model operasi tempat metode,
    kemitraan, dan kelayakan pascaprogram terus diasah melawan kondisi
    sebenarnya.
  imageAlt: >-
    Tim operasi lapangan BisaBaik menyusuri jalan setapak desa.

labels:
  context: Konteks
