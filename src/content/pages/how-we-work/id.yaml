meta:
  title: "Cara kerja kami: ko-desain, ko-kreasi, ko-keberlanjutan"
  description: >-
    Model perjalanan dampak dan pendekatan sadar risiko kami. Program dirancang
    untuk pelaksanaan, exit, dan keberlanjutan sekaligus.

header:
  title: Kerangka yang memperlakukan exit sebagai fase, bukan peristiwa.
  intro: >-
    Setiap penugasan bergerak melalui tiga fase yang saling menguatkan.
    Pelaksanaan, exit, dan keberlanjutan direncanakan bersamaan, karena dalam
    praktik ketiganya memang tidak pernah terpisah rapi.
  imageAlt: >-
    Seorang guru dan dua pelajar memeriksa lembar kertas bersama di halaman
    sekolah.

journey:
  heading: Ko-desain, ko-kreasi, ko-keberlanjutan.
  phaseLabel: Fase
  phases:
    - key: design
      numeral: I
      title: Ko-desain untuk pelaksanaan dan exit
      sub: Merancang program yang bisa dijalankan, akuntabel, dan sadar exit.
      imageAlt: >-
        Dua perempuan lansia di desa tertawa bersama, salah satunya dengan
        handuk di kepala.
      items:
        - Penyelarasan tujuan program dan harapan exit
        - Perencanaan pelaksanaan dan perancangan jalur exit
        - Pemetaan risiko sosial, operasional, dan kelembagaan
        - Identifikasi kapasitas lokal dan peran jangka panjang
    - key: create
      numeral: II
      title: Ko-kreasi lewat pelaksanaan yang akuntabel
      sub: Menjalankan program dengan monitoring, pembelajaran, dan disiplin operasional.
      imageAlt: >-
        Petugas kesehatan dan relawan mengukur tekanan darah dan mendata warga
        di pos kesehatan masyarakat.
      items:
        - Eksekusi program yang adaptif dengan tonggak yang jelas
        - Monitoring, akuntabilitas, dan pembelajaran adaptif
        - Penyiapan sistem, kepemimpinan, dan tata kelola lokal
        - Penyesuaian yang sadar risiko dan berpijak pada kondisi lapangan
    - key: sustain
      numeral: III
      title: Ko-keberlanjutan dengan exit yang bertanggung jawab
      sub: Memperpanjang dampak lewat sistem, pasar, dan kemitraan.
      imageAlt: >-
        Seorang perajin menggambar pola malam pada kain dengan canting,
        Yogyakarta.
      items:
        - Asesmen kesiapan exit dengan Exit Forward Model
        - Pengalihan peran dan kepemilikan ke aktor lokal
        - Integrasi ke mekanisme pasar dan sumber penghidupan
        - Tinjauan pascaexit terbatas dan penangkapan pembelajaran

risk:
  heading: Disiplin yang tetap tanggap pada apa yang terjadi di lapangan.
  body: >-
    Program pembangunan itu kompleks, dan exit adalah titik di mana
    kompleksitas itu paling terasa. Pendekatan yang sadar risiko itulah yang
    menjaga program tetap relevan dan akuntabel sepanjang pelaksanaan sampai
    transisi.
  imageAlt: >-
    Warga berbusana meriah berkumpul di jalan kampung yang dihias untuk
    perayaan warga.
  items:
    - label: Sosial dan kontekstual
      body: Dinamika komunitas, relasi kuasa, dan penerimaan warga setempat.
    - label: Operasional dan pelaksanaan
      body: Kapasitas mitra, koordinasi lapangan, dan konsistensi eksekusi.
    - label: Keberlanjutan dan exit
      body: Kesiapan kelembagaan, kepemilikan lokal, dan ketergantungan pascaprogram.
    - label: Reputasi dan akuntabilitas
      body: Kepatuhan, transparansi, dan kejelasan peran.
  manageHeading: Cara kami mengelolanya
  manage:
    - Identifikasi risiko sejak perancangan dan awal pelaksanaan
    - Monitoring berkelanjutan dan penyesuaian adaptif
    - Pembelajaran dikembalikan ke keputusan pelaksanaan dan exit
    - Dokumentasi dan pelaporan yang akuntabel

principles:
  heading: Tiga prinsip yang saling menguatkan.
  items:
    - title: Berpusat pada komunitas
      body: >-
        Berangkat dari kebutuhan, nilai, dan dinamika nyata komunitas.
        Komunitas adalah subjek perubahan, bukan objeknya.
    - title: Berbasis data
      body: >-
        Keputusan digerakkan studi awal, monitoring berkelanjutan, evaluasi
        mendalam, dan refleksi yang sistematis.
    - title: Sadar risiko
      body: >-
        Setiap tahap dikelola di dalam kerangka manajemen risiko sosial dan
        operasional, bukan lewat perkiraan informal.
