meta:
  title: "About Bisa Baik Bersama: an impact delivery partner"
  description: >-
    Bisa Baik Bersama is the impact delivery arm of Immers Asia Corp, turning
    impact advisory and program design into accountable work on the ground.

header:
  title: An impact delivery partner, not a charity.
  intro: >-
    We exist so that development programs are not only implemented well, but
    responsibly transitioned and still standing after external support ends.
    We are the implementation arm of Immers Asia Corp.
  imageAlt: >-
    Children from a partner community gathered outdoors during a program
    activity in Indonesia.

vision:
  heading: What we are working toward
  statement: >-
    Programs that are effectively delivered, responsibly transitioned, and
    sustained beyond external support.

mission:
  heading: How we get there
  items:
    - >-
      Provide end-to-end impact delivery with disciplined and measurable
      implementation.
    - >-
      Design and support responsible exit and transition through strengthened
      local capacity and governance.
    - >-
      Apply risk-aware and accountable practices at every stage of the
      intervention.
    - >-
      Extend program impact through post-program economic continuity, including
      domestic and export market access for UMKM.

why:
  heading: Execution discipline meets exit-aware design.
  body: >-
    Impact initiatives often lose momentum after funding ends. The cause is
    rarely a weak design. It is the absence of execution, transition and exit
    strategy. We turn advisory insight into measurable action while partners
    keep strategic ownership and full visibility of the program.
  items:
    - End-to-end delivery with a clearly defined exit pathway.
    - Direct or white-label execution, whichever suits the partner.
    - Disciplined risk management, accountability and reporting.
    - Local ownership transfer and post-program sustainability.
  imageAlt: >-
    BisaBaik field team reviewing program plans with local coordinators in a
    village hall.

team:
  heading: The people running the work
  intro: >-
    Experience spanning community facilitation, program management and
    cross-sectoral social intervention design, applied with a collaborative and
    reflective approach.
  members:
    - { name: Dasril Guntara, role: Managing Partner }
    - { name: Wiwip Wilevy, role: Executive Director }
    - { name: Fariz Adlan S., role: Program Director }
    - { name: Maulana Arif, role: Marketing Director }
    - { name: Handriyana, role: Finance Director }
    - { name: Raisa Annisa, role: Program Manager }

network:
  heading: An associate expert network, activated by program need.
  body: >-
    For specific thematic needs, programs are reinforced by an associate expert
    network that supports quality assurance, methodological depth and knowledge
    transfer. It is brought in by context, not kept on standing overhead.
  items:
    - Impact delivery, MEAL and exit strategy
    - UMKM strengthening and market continuity
    - Market expansion and value chain development
    - Digital business and sharia economic models
    - Circular economy and waste-to-value systems
    - Community learning and capacity building
    - Sustainable and commodity-based value chains
  imageAlt: >-
    Baskets of freshly harvested produce prepared by an UMKM group for market.
