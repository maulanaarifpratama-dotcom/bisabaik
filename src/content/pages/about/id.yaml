meta:
  title: "Tentang Bisa Baik Bersama: mitra pelaksana program dampak"
  description: >-
    Bisa Baik Bersama adalah lengan pelaksana program dampak dari Immers Asia
    Corp, mengubah kajian dampak dan desain program menjadi kerja yang
    akuntabel di lapangan.

header:
  title: Mitra pelaksana, bukan lembaga amal.
  intro: >-
    Kami ada supaya program pembangunan bukan cuma dijalankan dengan baik, tapi
    juga dialihkan dengan bertanggung jawab dan tetap berdiri setelah dukungan
    eksternal berakhir. Kami adalah lengan pelaksana Immers Asia Corp.
  imageAlt: >-
    Anak-anak dari komunitas mitra berkumpul di luar ruangan dalam sebuah
    kegiatan program di Indonesia.

vision:
  heading: Yang sedang kami tuju
  statement: >-
    Program yang dijalankan secara efektif, dialihkan dengan bertanggung jawab,
    dan tetap berlanjut setelah dukungan eksternal berakhir.

mission:
  heading: Cara kami menempuhnya
  items:
    - >-
      Menyediakan pelaksanaan program dampak menyeluruh yang disiplin dan
      terukur.
    - >-
      Merancang dan mendampingi exit serta transisi yang bertanggung jawab
      lewat penguatan kapasitas dan tata kelola lokal.
    - >-
      Menerapkan praktik yang sadar risiko dan akuntabel di setiap tahap
      intervensi.
    - >-
      Memperpanjang dampak program lewat keberlanjutan ekonomi pascaprogram,
      termasuk akses pasar domestik dan ekspor bagi UMKM.

why:
  heading: Disiplin eksekusi bertemu desain yang sadar exit.
  body: >-
    Inisiatif dampak sering kehilangan momentum setelah pendanaan berakhir.
    Penyebabnya jarang desain yang lemah, melainkan tidak adanya strategi
    eksekusi, transisi, dan exit. Kami mengubah temuan kajian menjadi tindakan
    terukur, sementara mitra tetap memegang kepemilikan strategis dan melihat
    penuh jalannya program.
  items:
    - Pelaksanaan menyeluruh dengan jalur exit yang jelas sejak awal.
    - Eksekusi langsung atau white-label, mengikuti kebutuhan mitra.
    - Manajemen risiko, akuntabilitas, dan pelaporan yang disiplin.
    - Pengalihan kepemilikan lokal dan keberlanjutan pascaprogram.
  imageAlt: >-
    Tim lapangan BisaBaik meninjau rencana program bersama koordinator setempat
    di balai desa.

team:
  heading: Orang-orang yang menjalankan pekerjaannya
  intro: >-
    Pengalaman yang mencakup fasilitasi komunitas, manajemen program, dan
    perancangan intervensi sosial lintas sektor, dijalankan dengan pendekatan
    kolaboratif dan reflektif.
  members:
    - { name: Dasril Guntara, role: Managing Partner }
    - { name: Wiwip Wilevy, role: Direktur Eksekutif }
    - { name: Fariz Adlan S., role: Direktur Program }
    - { name: Maulana Arif, role: Direktur Pemasaran }
    - { name: Handriyana, role: Direktur Keuangan }
    - { name: Raisa Annisa, role: Manajer Program }

network:
  heading: Jejaring ahli asosiat, diaktifkan sesuai kebutuhan program.
  body: >-
    Untuk kebutuhan tematik tertentu, program diperkuat jejaring ahli asosiat
    yang menopang penjaminan mutu, kedalaman metodologi, dan alih pengetahuan.
    Mereka dipanggil sesuai konteks, bukan dipelihara sebagai beban tetap.
  items:
    - Pelaksanaan program dampak, MEAL, dan strategi exit
    - Penguatan UMKM dan keberlanjutan pasar
    - Perluasan pasar dan pengembangan rantai nilai
    - Bisnis digital dan model ekonomi syariah
    - Ekonomi sirkular dan sistem sampah menjadi nilai
    - Pembelajaran komunitas dan penguatan kapasitas
    - Rantai nilai berkelanjutan berbasis komoditas
  imageAlt: >-
    Keranjang hasil panen segar yang disiapkan kelompok UMKM untuk dipasarkan.
