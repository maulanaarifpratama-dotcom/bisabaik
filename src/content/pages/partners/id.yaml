meta:
  title: "Mitra: filantropi, korporasi, pembangunan, pemerintah"
  description: >-
    Mitra filantropi, korporasi, pemerintah, dan pembangunan yang memilih
    BisaBaik untuk pelaksanaan akuntabel dan exit yang bertanggung jawab.

header:
  title: Lembaga yang memilih pelaksanaan yang akuntabel.
  intro: >-
    Kami bekerja dengan mitra yang melihat pelaksanaan, exit, dan keberlanjutan
    sebagai satu proses. Tiap kolaborasi dijelaskan lewat peran dan konteksnya,
    karena logo di dinding tidak menceritakan apa pun soal isi pekerjaannya.
  imageAlt: >-
    Warga berbusana meriah berkumpul di jalan kampung yang dihias untuk
    perayaan warga.

groups:
  - key: philanthropic
    label: Lembaga filantropi
    blurb: >-
      Lembaga zakat dan yayasan yang bermitra untuk pelaksanaan dan exit yang
      disiplin.
    imageAlt: >-
      Seorang perempuan lansia berikat kepala jingga, dengan sawah dan pondok
      tani di belakangnya.
  - key: corporate
    label: CSR dan ESG korporasi
    blurb: >-
      Mitra korporasi yang menyelaraskan program dampak dengan akuntabilitas
      operasional.
    imageAlt: >-
      Seorang perempuan muda berkerudung ungu menyortir sayuran di lapak pasar
      yang penuh cabai merah.
  - key: development
    label: Organisasi pembangunan
    blurb: >-
      Mitra pembangunan nasional dan internasional yang berbagi kerja lapangan.
    imageAlt: >-
      Dua perempuan lansia di desa tertawa bersama, salah satunya dengan
      handuk di kepala.
  - key: government
    label: Pemerintah dan sektor publik
    blurb: >-
      Kolaborasi sektor publik untuk keberlanjutan pasar dan tata kelola
      program.
    imageAlt: >-
      Seorang lelaki lansia berkaus sepak bola duduk di pasar terbuka di Papua
      di antara dua perempuan, salah satunya berseragam dinas.
