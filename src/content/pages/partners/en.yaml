meta:
  title: "Partners: philanthropic, corporate, development, government"
  description: >-
    Philanthropic, corporate, government and development partners who choose
    BisaBaik for accountable delivery, responsible exit and post-program
    continuity.

header:
  title: Institutions choosing accountable delivery.
  intro: >-
    We work with partners who treat delivery, exit and sustainability as one
    process. Each collaboration is described by role and context, because a
    logo on a wall says nothing about what the work involved.
  imageAlt: >-
    Villagers in festive dress gathered on a street decorated for a community
    celebration.

groups:
  - key: philanthropic
    label: Philanthropic institutions
    blurb: >-
      Zakat bodies and foundations partnering on disciplined delivery and exit.
    imageAlt: >-
      An older woman in an orange headwrap, with rice fields and a farm hut
      behind her.
  - key: corporate
    label: Corporate CSR and ESG
    blurb: >-
      Corporate partners aligning impact programs with operational
      accountability.
    imageAlt: >-
      A young woman in a purple headscarf sorting vegetables at a market stall
      heaped with red chilies.
  - key: development
    label: Development organisations
    blurb: >-
      International and national development partners sharing field delivery.
    imageAlt: >-
      Two older village women laughing together, one with a towel over her
      head.
  - key: government
    label: Government and public sector
    blurb: >-
      Public sector collaboration on market continuity and program governance.
    imageAlt: >-
      An older man in a football shirt sitting at an open-air market in Papua
      between two women, one in an official uniform.
