header:
  title: Institutions choosing accountable delivery.
  intro: >-
    We work with partners who treat delivery, exit and sustainability as one
    process. Each collaboration is described by role and context, because a
    logo on a wall says nothing about what the work involved.
  imageAlt: >-
    Coordination meeting between Indonesian institutional partners.

