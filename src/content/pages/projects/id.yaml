meta:
  title: "Proyek dan penugasan di Indonesia dan Türkiye"
  description: >-
    Potret terstandar dari program unggulan dan penugasan mitra kami: konteks,
    peran, lingkup pelaksanaan, mekanisme exit, dan sinyal dampaknya.

header:
  title: Satu lensa yang sama untuk setiap penugasan.
  intro: >-
    Tiap proyek dijelaskan lewat lima pertanyaan yang sama: apa konteksnya, apa
    peran kami, apa yang kami kerjakan, bagaimana berakhirnya, dan sinyal apa
    yang ditinggalkannya.
  imageAlt: >-
    Seorang perempuan muda berkerudung ungu menyortir sayuran di lapak pasar
    yang penuh cabai merah.

flagship:
  heading: Model yang diuji dan diasah lewat pelaksanaan.
  body: >-
    Ini bukan uji coba. Ini sistem yang beroperasi, tempat metode, kemitraan,
    dan kelayakan pascaprogram terus diasah di lapangan.
  imageAlt: >-
    Dua petani menanam bibit padi di sawah yang tergenang, dengan perbukitan
    berhutan di belakangnya.

engagements:
  heading: Penugasan mitra
  body: >-
    Pekerjaan berdurasi lebih pendek, dijelaskan lewat lima pertanyaan yang
    sama.

